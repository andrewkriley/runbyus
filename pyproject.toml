[project]
name = "runbyus"
version = "0.1.0"
description = "runbyus: ledger-backed assistant with dual runtime adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic-ai-slim[mcp]>=0.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runbyus"]

[tool.uv]
package = true
